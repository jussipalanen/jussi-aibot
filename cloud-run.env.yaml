# Environment variables of the Cloud Run service jussi-ai-platform (see the README's
# "Deploy on Google Cloud Run" section). Every deploy sets exactly these: a variable
# removed here is removed from the service. Values must be strings, so quote numbers
# and booleans.
#
# Never put secrets here: this file is public. Secrets live in Secret Manager and are
# listed in SECRETS in .github/workflows/deploy.yml and CLOUD_RUN_SECRETS in dev.

# ── AI ──────────────────────────────────────────────────────────────────────
# gemini = the GEMINI_API_KEY from AI Studio. Without GCP_PROJECT it never falls back
# to Vertex AI, which would be billed to the Google Cloud project.
DEFAULT_PROVIDER: gemini             # legacy /ai/review
REVIEW_PROVIDER: gemini              # /v1/review
AGENT_PROVIDER: gemini               # chatbots
DISABLE_LOCAL_MODEL: 'true'
# Free: GEMINI_API_KEY is an AI Studio key without billing, and flash-lite has the
# highest free-tier limits. Every chatbot and review uses it.
GEMINI_MODEL: gemini-2.5-flash-lite
AGENT_VERTEX_MODEL: gemini-2.5-flash-lite

# ── Agents ──────────────────────────────────────────────────────────────────
JUSSISPACE_API_URL: https://backend-lab-jussispace.jussialanen.com/api
JUSSISPACE_FRONTEND_URL: https://jussispace-production.lab.jussialanen.com
JUSSILOG_STORAGE_BASE_URL: https://jussilog-backend-uploads.storage.googleapis.com

# ── Access ──────────────────────────────────────────────────────────────────
# Browser frontends, comma-separated. The service's own pages (the demos) are
# always allowed.
ALLOWED_ORIGINS: https://jussispace-production.lab.jussialanen.com
DAILY_RATE_LIMIT: 50/day
# Cloud Run adds the caller's address last in X-Forwarded-For.
FORWARDED_IP_DEPTH: '1'

# ── Review demo (/demo/review, /demo/code-review) ───────────────────────────
DEMO_PUBLIC: 'true'
DEMO_RATE_LIMIT: 20/day
