<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{name}}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="home">
<main class="card">
  <div class="logo" aria-label="{{name}}">
    <span class="mark" aria-hidden="true">AI</span>
    <span class="wordmark">{{name}}</span>
  </div>
  <p class="lead">{{description}}</p>
  {{demos}}
  <section>
    <h2>For developers</h2>
    <nav class="actions">
      <a class="button {{docs_class}}" href="/docs">API documentation</a>
      <a class="button" href="/redoc">ReDoc</a>
      <a class="button" href="/openapi.json">OpenAPI JSON</a>
    </nav>
  </section>
  <footer>Version {{version}} · <a href="/health">Status</a></footer>
</main>
</body>
</html>
